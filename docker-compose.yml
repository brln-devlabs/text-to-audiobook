services:
  ai-tts:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ai-tts-app
    volumes:
      - ./input:/app/input
      - ./output:/app/output
      - ./cache:/app/cache
      - ./logs:/app/logs
      - ./models:/app/models
      - ./settings.json:/app/settings.json
    environment:
      - HF_TOKEN=${HF_TOKEN:-}
    # Default command: stage 1 + 2 for all projects. Override, e.g.
    #   docker compose run --rm ai-tts generate -p MyBook
    command: ["run"]
