name: Build and Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            binary: text-to-audiobook
            asset_name: text-to-audiobook-linux
            features: --features llm
          - os: windows-latest
            binary: text-to-audiobook.exe
            asset_name: text-to-audiobook-windows.exe
            features: --features llm
          - os: macos-latest
            binary: text-to-audiobook
            asset_name: text-to-audiobook-macos
            features: --features metal

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo build
        uses: Swatinem/rust-cache@v2

      - name: Build release binary
        run: cargo build --release --locked ${{ matrix.features }}

      - name: Rename binary
        shell: bash
        run: |
          mkdir -p dist
          cp "target/release/${{ matrix.binary }}" "dist/${{ matrix.asset_name }}"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset_name }}
          path: dist/${{ matrix.asset_name }}

  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo build
        uses: Swatinem/rust-cache@v2

      - name: Run tests
        run: cargo test --locked --features llm

  create-release:
    needs: [build, test]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')

    steps:
      - uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          body: |
            # text-to-audiobook Release

            Pre-built binaries for Windows, Linux and macOS (CPU builds; macOS with Metal).
            For NVIDIA GPUs build from source with `cargo build --release --features cuda,llm`.

            ## Download

            - **Windows**: `text-to-audiobook-windows.exe`
            - **Linux**: `text-to-audiobook-linux` - make it executable with `chmod +x`
            - **macOS**: `text-to-audiobook-macos` - make it executable with `chmod +x`

            ## Notes

            - The first run downloads the models (Llama 3.2 1B and Qwen3-TTS)
            - See [README.md](https://github.com/${{ github.repository }}/blob/${{ github.ref_name }}/README.md) for details
