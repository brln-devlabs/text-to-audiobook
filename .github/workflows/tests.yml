name: Tests

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master, develop]

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo build
        uses: Swatinem/rust-cache@v2

      - name: Run tests
        run: cargo test --locked --features llm

  headless:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo build
        uses: Swatinem/rust-cache@v2

      - name: Test without GUI and model backends
        run: cargo test --locked --no-default-features

      - name: Dry run of the CLI
        run: |
          mkdir -p demo/input
          printf 'Ein kurzer Text. Mit zwei Sätzen.\n\nNeuer Absatz.\n' > demo/input/Probe.md
          cargo run --locked --no-default-features -- --root demo --mock-models run
          test -s demo/output/Probe/final/audiobook.mp3
