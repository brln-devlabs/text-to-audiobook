# Windows: link the C runtime statically, so the program runs without the
# "Microsoft Visual C++ Redistributable". esaxx-rs (via tokenizers) always
# builds with the static runtime, so everything else has to match.
[target.x86_64-pc-windows-msvc]
rustflags = ["-C", "target-feature=+crt-static"]

[target.aarch64-pc-windows-msvc]
rustflags = ["-C", "target-feature=+crt-static"]

[env]
# llama-cpp-sys-2: static runtime for llama.cpp as well (only affects MSVC) ...
LLAMA_STATIC_CRT = "1"
# ... which its CMake build only honours through the toolchain file
# (read by the cmake crate for these targets only)
CMAKE_TOOLCHAIN_FILE_x86_64_pc_windows_msvc = { value = ".cargo/windows-static-crt.cmake", relative = true }
CMAKE_TOOLCHAIN_FILE_aarch64_pc_windows_msvc = { value = ".cargo/windows-static-crt.cmake", relative = true }
